[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvester-risk-atlas"
version = "2.0.0"
description = "Harvester Risk Atlas data pipeline: Harvest Priority Index v2 for wild medicinal plants of the Philippines (EthnoHACK 2026 Track 3)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ymir Hackathon / EthnoHACK 2026" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "h3>=4.0",
  "plotly>=5.18",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "rasterio>=1.3",
  "reportlab>=4.0",
]

[project.optional-dependencies]
nlp = ["langchain>=0.1", "openai>=1.0"]
dev = ["pytest>=7.0"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.0", "matplotlib>=3.8", "seaborn>=0.13", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
