[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvester-risk-atlas"
version = "0.1.0"
description = "EthnoHACK 2026 Track 3 — Biodiversity & Sustainability: medicinal-plant harvest/climate pressure atlas for the Philippines / SEA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ymir Hackathon / EthnoHACK 2026" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "folium>=0.15",
  "streamlit>=1.28",
  "streamlit-folium>=0.15",
  "plotly>=5.18",
  "scikit-learn>=1.3",
  "requests>=2.31",
  "pygbif>=0.6",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "rasterio>=1.3",
  "reportlab>=4.0",
]

[project.optional-dependencies]
nlp = ["langchain>=0.1", "openai>=1.0"]
dev = ["jupyter>=1.0", "ipykernel>=6.0", "pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
